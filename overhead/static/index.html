<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Overhead</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- A living aeronautical chart. 800x480, scaled to the display. -->
  <div id="stage">
    <canvas id="chart" width="800" height="480"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true"></div>

    <!-- chronometer, upper right -->
    <div class="chrono">
      <span id="clock">--:--</span>
      <em>local time</em>
    </div>

    <!-- title cartouche, lower left — the chart's legend block, always present -->
    <div class="cartouche">
      <div class="title">Overhead</div>
      <div class="rule"></div>
      <div class="sub">Aircraft over Caledonia &amp; Norman · Toronto</div>
      <div class="coords" id="coords"></div>
    </div>

    <!-- idle note -->
    <div id="idle" class="idle">clear skies overhead</div>

    <!-- boarding-pass ticket — appears only when an aircraft is overhead -->
    <div id="ticket" class="ticket" aria-hidden="true">
      <div class="stub">
        <div class="stub-label">overhead</div>
        <div class="stub-reg" id="tReg"></div>
      </div>
      <div class="body">
        <div class="line1">
          <span class="airline" id="tAirline"></span>
          <span class="flight" id="tFlight"></span>
        </div>
        <div class="route" id="tRoute">
          <div class="end">
            <div class="code" id="oCode"></div>
            <div class="place" id="oCity"></div>
          </div>
          <div class="leg"><span class="dots"></span><span class="mark">✈</span><span class="dots"></span></div>
          <div class="end">
            <div class="code" id="dCode"></div>
            <div class="place" id="dCity"></div>
          </div>
        </div>
        <div class="fact" id="tFact"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
